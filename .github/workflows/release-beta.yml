name: Beta release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Validate tag and manifest versions
        id: version
        shell: bash
        run: |
          version="$(python3 scripts/check-release-version.py "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  backend-and-frontend-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Type-check and build frontend
        working-directory: frontend
        run: yarn build
      - name: Check backend formatting
        working-directory: backend
        run: cargo fmt --check
      - name: Lint backend
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test backend
        working-directory: backend
        run: cargo test --all-features --locked

  android-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
      - name: Make Gradle wrapper executable
        run: chmod +x android-wrapper/gradlew
      - name: Run Android tests and lint
        working-directory: android-wrapper
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Retain Android test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: beta-android-test-reports
          path: |
            android-wrapper/app/build/reports/
            android-wrapper/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  desktop-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install and build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Prepare desktop sidecar
        run: ./scripts/prepare-tauri-sidecar-dev.sh
      - name: Check desktop formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Check desktop wrapper
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test desktop wrapper
        working-directory: src-tauri
        run: cargo test --locked

  build-linux:
    needs: [validate, backend-and-frontend-tests, android-tests, desktop-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install RPM and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Build RPM
        run: |
          test "$(uname -m)" = "x86_64"
          ./scripts/build-desktop.sh
      - name: Collect RPM
        shell: bash
        run: |
          mapfile -t packages < <(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one RPM, found ${#packages[@]}." >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${packages[0]}" "release-assets/drop-den-${RELEASE_VERSION}-linux-x86_64.rpm"
      - name: Upload Linux release asset
        uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: release-assets/*.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Retain Linux bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: beta-linux-bundle-diagnostics
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    needs: [validate, backend-and-frontend-tests, android-tests, desktop-tests]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build unsigned NSIS installer
        shell: pwsh
        run: ./scripts/build-desktop-windows.ps1 -SkipDependencyInstall
      - name: Collect Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $installers[0].FullName "release-assets/drop-den-$env:RELEASE_VERSION-windows-x64-setup.exe"
      - name: Upload Windows release asset
        uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: release-assets/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Retain Windows bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: beta-windows-bundle-diagnostics
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14

  build-android:
    needs: [validate, backend-and-frontend-tests, android-tests, desktop-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
      - name: Validate signing secrets and reconstruct keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub secret $name is not configured." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/drop-den-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
      - name: Build signed release APK
        working-directory: android-wrapper
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/drop-den-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/drop-den-release.jks"
      - name: Verify and collect signed APK
        shell: bash
        run: |
          apk="android-wrapper/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner verify --verbose "$apk"
          mkdir -p release-assets
          cp "$apk" "release-assets/drop-den-${RELEASE_VERSION}-android.apk"
      - name: Upload Android release asset
        uses: actions/upload-artifact@v5
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: beta-android-build-diagnostics
          path: |
            android-wrapper/app/build/outputs/
            android-wrapper/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [validate, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Download complete release asset set
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          expected=(
            "drop-den-${RELEASE_VERSION}-linux-x86_64.rpm"
            "drop-den-${RELEASE_VERSION}-windows-x64-setup.exe"
            "drop-den-${RELEASE_VERSION}-android.apk"
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${actual[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo "Release asset set is incomplete or contains unexpected files." >&2
            printf 'Expected: %s\n' "${wanted[*]}" >&2
            printf 'Actual: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish complete GitHub pre-release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi

          cleanup_draft() {
            if [[ "$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' 2>/dev/null || true)" == "true" ]]
            then
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          }
          trap cleanup_draft EXIT

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --generate-notes \
            --title "Drop Den ${RELEASE_TAG}" \
            release-assets/*

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
